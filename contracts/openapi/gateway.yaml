consumes:
- application/json
definitions:
  ApplicationServiceUpdateApplicationStatusBody:
    properties:
      status:
        $ref: '#/definitions/v1ApplicationStatus'
    type: object
  CandidateServiceCompleteUploadBody:
    type: object
  CandidateServiceReparseCVBody:
    type: object
  ErrorEnvelope:
    properties:
      error:
        properties:
          code:
            description: gRPC code name, e.g. UNAUTHENTICATED.
            type: string
          details:
            items:
              type: object
            type: array
          message:
            type: string
          request_id:
            type: string
        required:
        - code
        - message
        type: object
    required:
    - error
    type: object
  JobServiceCloseJobBody:
    type: object
  JobServicePublishJobBody:
    type: object
  JobServiceUpdateJobBody:
    properties:
      description:
        type: string
      level:
        $ref: '#/definitions/v1JobLevel'
      location:
        type: string
      nice_to_have_skills:
        $ref: '#/definitions/v1StringList'
      required_skills:
        $ref: '#/definitions/v1StringList'
      salary_max:
        format: int32
        type: integer
      salary_min:
        format: int32
        type: integer
      title:
        type: string
    type: object
  LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  NotificationServiceMarkNotificationReadBody:
    type: object
  TokenResponse:
    properties:
      access_token:
        description: RS256 JWT access token.
        type: string
      expires_in:
        description: Access token lifetime in seconds.
        format: int64
        type: integer
    required:
    - access_token
    - expires_in
    type: object
  protobufAny:
    additionalProperties: true
    properties:
      '@type':
        type: string
    type: object
  rpcStatus:
    properties:
      code:
        format: int32
        type: integer
      details:
        items:
          $ref: '#/definitions/protobufAny'
          type: object
        type: array
      message:
        type: string
    type: object
  smarthireApplicationV1ScoreBreakdown:
    properties:
      experience_fit:
        format: double
        type: number
      location_fit:
        format: double
        type: number
      matched_skills:
        items:
          type: string
        type: array
      missing_skills:
        items:
          type: string
        type: array
      required_skill_coverage:
        format: double
        type: number
      semantic_similarity:
        format: double
        type: number
    type: object
  smarthireCandidateV1MatchBreakdown:
    description: MatchBreakdown explains a match score (copy of smarthire.ai.v1.ScoreBreakdown).
    properties:
      experience_fit:
        format: double
        type: number
      location_fit:
        format: double
        type: number
      matched_skills:
        items:
          type: string
        type: array
      missing_skills:
        items:
          type: string
        type: array
      required_skill_coverage:
        format: double
        type: number
      semantic_similarity:
        format: double
        type: number
    type: object
  smarthireJobV1MatchBreakdown:
    description: MatchBreakdown explains a match score (copy of smarthire.ai.v1.ScoreBreakdown).
    properties:
      experience_fit:
        format: double
        type: number
      location_fit:
        format: double
        type: number
      matched_skills:
        items:
          type: string
        type: array
      missing_skills:
        items:
          type: string
        type: array
      required_skill_coverage:
        format: double
        type: number
      semantic_similarity:
        format: double
        type: number
    type: object
  v1Application:
    properties:
      breakdown:
        $ref: '#/definitions/smarthireApplicationV1ScoreBreakdown'
      candidate_id:
        type: string
      created_at:
        format: date-time
        type: string
      cv_id:
        type: string
      id:
        type: string
      job_id:
        type: string
      model_version:
        type: string
      reason:
        description: |-
          Why the saga ended where it did: quota_exceeded, job_closed, timeout,
          ai_unavailable, not_matched; empty otherwise.
        type: string
      score:
        format: double
        type: number
      status:
        $ref: '#/definitions/v1ApplicationStatus'
      updated_at:
        format: date-time
        type: string
      version:
        format: int64
        type: string
    type: object
  v1ApplicationStatus:
    default: APPLICATION_STATUS_UNSPECIFIED
    enum:
    - APPLICATION_STATUS_UNSPECIFIED
    - APPLICATION_STATUS_PENDING
    - APPLICATION_STATUS_SCREENING
    - APPLICATION_STATUS_SCREENED
    - APPLICATION_STATUS_NEEDS_MANUAL_REVIEW
    - APPLICATION_STATUS_INTERVIEW
    - APPLICATION_STATUS_OFFERED
    - APPLICATION_STATUS_HIRED
    - APPLICATION_STATUS_REJECTED
    - APPLICATION_STATUS_CANCELLED
    type: string
  v1CV:
    description: CV never exposes the storage object key or a download URL.
    properties:
      created_at:
        format: date-time
        type: string
      file_name:
        type: string
      id:
        type: string
      parse_error:
        type: string
      parsed:
        $ref: '#/definitions/v1ParsedCV'
      parsed_at:
        format: date-time
        type: string
      size_bytes:
        format: int64
        type: string
      status:
        $ref: '#/definitions/v1CVStatus'
      updated_at:
        format: date-time
        type: string
      version:
        format: int64
        type: string
    type: object
  v1CVStatus:
    default: CV_STATUS_UNSPECIFIED
    enum:
    - CV_STATUS_UNSPECIFIED
    - CV_STATUS_UPLOADING
    - CV_STATUS_UPLOADED
    - CV_STATUS_PARSED
    - CV_STATUS_FAILED
    type: string
  v1CreateJobRequest:
    properties:
      description:
        type: string
      level:
        $ref: '#/definitions/v1JobLevel'
      location:
        type: string
      nice_to_have_skills:
        items:
          type: string
        type: array
      required_skills:
        items:
          type: string
        type: array
      salary_max:
        format: int32
        type: integer
      salary_min:
        format: int32
        type: integer
      title:
        type: string
    type: object
  v1CreateUploadURLRequest:
    properties:
      consent:
        type: boolean
      file_name:
        type: string
    type: object
  v1CreateUploadURLResponse:
    properties:
      cv_id:
        type: string
      expires_at:
        format: date-time
        type: string
      upload_url:
        type: string
    type: object
  v1Education:
    description: |-
      Content limits of ParsedCV (lengths, ranges, YYYY-MM dates) are enforced by
      the JSON Schema contracts/events/cv.parsed.v1.json#/$defs/ParsedCV in the app.
    properties:
      degree:
        type: string
      end_year:
        format: int32
        type: integer
      major:
        type: string
      school:
        type: string
    type: object
  v1Experience:
    properties:
      company:
        type: string
      end:
        type: string
      highlights:
        items:
          type: string
        type: array
      start:
        type: string
      title:
        type: string
    type: object
  v1Facet:
    properties:
      count:
        format: int64
        type: string
      value:
        type: string
    type: object
  v1GetApplicationResponse:
    properties:
      application:
        $ref: '#/definitions/v1Application'
      history:
        items:
          $ref: '#/definitions/v1HistoryEntry'
          type: object
        type: array
    type: object
  v1HistoryEntry:
    properties:
      actor:
        title: user id, or "system" for the saga
        type: string
      at:
        format: date-time
        type: string
      from:
        $ref: '#/definitions/v1ApplicationStatus'
        title: UNSPECIFIED for the creation entry
      reason:
        type: string
      to:
        $ref: '#/definitions/v1ApplicationStatus'
    type: object
  v1Job:
    properties:
      created_at:
        format: date-time
        type: string
      description:
        type: string
      id:
        type: string
      level:
        $ref: '#/definitions/v1JobLevel'
      location:
        type: string
      nice_to_have_skills:
        items:
          type: string
        type: array
      published_at:
        format: date-time
        type: string
      recruiter_id:
        type: string
      required_skills:
        items:
          type: string
        type: array
      salary_max:
        format: int32
        type: integer
      salary_min:
        format: int32
        type: integer
      status:
        $ref: '#/definitions/v1JobStatus'
      title:
        type: string
      updated_at:
        format: date-time
        type: string
      version:
        format: int64
        type: string
    type: object
  v1JobLevel:
    default: JOB_LEVEL_UNSPECIFIED
    enum:
    - JOB_LEVEL_UNSPECIFIED
    - JOB_LEVEL_INTERN
    - JOB_LEVEL_JUNIOR
    - JOB_LEVEL_MIDDLE
    - JOB_LEVEL_SENIOR
    - JOB_LEVEL_LEAD
    type: string
  v1JobStatus:
    default: JOB_STATUS_UNSPECIFIED
    enum:
    - JOB_STATUS_UNSPECIFIED
    - JOB_STATUS_DRAFT
    - JOB_STATUS_OPEN
    - JOB_STATUS_CLOSED
    type: string
  v1ListApplicationsResponse:
    properties:
      applications:
        items:
          $ref: '#/definitions/v1Application'
          type: object
        type: array
      next_page_token:
        type: string
    type: object
  v1ListJobsFacets:
    properties:
      levels:
        items:
          $ref: '#/definitions/v1Facet'
          type: object
        type: array
      locations:
        items:
          $ref: '#/definitions/v1Facet'
          type: object
        type: array
      skills:
        items:
          $ref: '#/definitions/v1Facet'
          type: object
        type: array
    type: object
  v1ListJobsResponse:
    properties:
      degraded:
        description: |-
          True when the search read model was unavailable and ListJobs was served
          from the Postgres fallback (no facets, simpler ranking).
        type: boolean
      facets:
        $ref: '#/definitions/v1ListJobsFacets'
        description: |-
          Bucket counts over the matching open jobs (ListJobs from the search read
          model only; empty for ListMyJobs and when degraded). Values are normalized
          (lowercase, without diacritics).
      jobs:
        items:
          $ref: '#/definitions/v1Job'
          type: object
        type: array
      next_page_token:
        type: string
    type: object
  v1ListMatchedCandidatesResponse:
    properties:
      candidates:
        items:
          $ref: '#/definitions/v1MatchedCandidate'
          type: object
        type: array
      model_version:
        type: string
    type: object
  v1ListMyCVsResponse:
    properties:
      cvs:
        items:
          $ref: '#/definitions/v1CV'
          type: object
        type: array
      next_page_token:
        type: string
    type: object
  v1ListNotificationsResponse:
    properties:
      next_page_token:
        type: string
      notifications:
        items:
          $ref: '#/definitions/v1Notification'
          type: object
        type: array
      unread_count:
        format: int32
        type: integer
    type: object
  v1ListRecommendedJobsResponse:
    properties:
      jobs:
        items:
          $ref: '#/definitions/v1RecommendedJob'
          type: object
        type: array
      model_version:
        type: string
    type: object
  v1MatchedCandidate:
    properties:
      breakdown:
        $ref: '#/definitions/smarthireJobV1MatchBreakdown'
      candidate_id:
        type: string
      cv_id:
        type: string
      score:
        format: double
        type: number
    type: object
  v1Notification:
    properties:
      body:
        type: string
      created_at:
        format: date-time
        type: string
      data:
        additionalProperties:
          type: string
        description: Ids the client can link to (job_id, application_id, cv_id, ...).
        type: object
      id:
        type: string
      read_at:
        format: date-time
        type: string
      title:
        type: string
      type:
        title: |-
          welcome, cv_parsed, cv_parse_failed, application_received,
          application_status, candidates_matched
        type: string
    type: object
  v1ParsedCV:
    properties:
      current_title:
        type: string
      education:
        items:
          $ref: '#/definitions/v1Education'
          type: object
        type: array
      email:
        type: string
      experiences:
        items:
          $ref: '#/definitions/v1Experience'
          type: object
        type: array
      full_name:
        type: string
      languages:
        items:
          type: string
        type: array
      location:
        type: string
      skills:
        items:
          type: string
        type: array
      years_of_experience:
        format: double
        type: number
    type: object
  v1Profile:
    properties:
      created_at:
        format: date-time
        type: string
      full_name:
        type: string
      location:
        type: string
      phone:
        type: string
      updated_at:
        format: date-time
        type: string
      user_id:
        type: string
    type: object
  v1RecommendedJob:
    properties:
      breakdown:
        $ref: '#/definitions/smarthireCandidateV1MatchBreakdown'
      job_id:
        type: string
      level:
        title: intern|junior|middle|senior|lead
        type: string
      location:
        type: string
      salary_max:
        format: int32
        type: integer
      salary_min:
        format: int32
        type: integer
      score:
        format: double
        type: number
      title:
        type: string
    type: object
  v1RegisterRequest:
    properties:
      email:
        type: string
      password:
        type: string
      role:
        $ref: '#/definitions/v1Role'
    type: object
  v1RegisterResponse:
    properties:
      user_id:
        type: string
    type: object
  v1Role:
    default: ROLE_UNSPECIFIED
    enum:
    - ROLE_UNSPECIFIED
    - ROLE_CANDIDATE
    - ROLE_RECRUITER
    - ROLE_ADMIN
    type: string
  v1StringList:
    properties:
      values:
        items:
          type: string
        type: array
    type: object
  v1SubmitApplicationRequest:
    properties:
      cv_id:
        type: string
      job_id:
        type: string
    type: object
  v1UpsertMyProfileRequest:
    properties:
      full_name:
        type: string
      location:
        type: string
      phone:
        type: string
    type: object
  v1User:
    properties:
      created_at:
        format: date-time
        type: string
      email:
        type: string
      id:
        type: string
      role:
        $ref: '#/definitions/v1Role'
    type: object
info:
  title: SmartHire Gateway API
  version: version not set
paths:
  /v1/applications:
    get:
      operationId: ApplicationService_ListApplications
      parameters:
      - description: empty = any job
        in: query
        name: job_id
        required: false
        type: string
      - default: APPLICATION_STATUS_UNSPECIFIED
        description: 0 = any status
        enum:
        - APPLICATION_STATUS_UNSPECIFIED
        - APPLICATION_STATUS_PENDING
        - APPLICATION_STATUS_SCREENING
        - APPLICATION_STATUS_SCREENED
        - APPLICATION_STATUS_NEEDS_MANUAL_REVIEW
        - APPLICATION_STATUS_INTERVIEW
        - APPLICATION_STATUS_OFFERED
        - APPLICATION_STATUS_HIRED
        - APPLICATION_STATUS_REJECTED
        - APPLICATION_STATUS_CANCELLED
        in: query
        name: status
        required: false
        type: string
      - description: 0 = default 20
        format: int32
        in: query
        name: page_size
        required: false
        type: integer
      - in: query
        name: page_token
        required: false
        type: string
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListApplicationsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      summary: Candidates see their own applications, recruiters those on their jobs.
      tags:
      - ApplicationService
    post:
      operationId: ApplicationService_SubmitApplication
      parameters:
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1SubmitApplicationRequest'
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Application'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      summary: |-
        Requires the Idempotency-Key header (gRPC metadata "idempotency-key").
        Answers 202: the application starts PENDING and the saga moves it on.
      tags:
      - ApplicationService
  /v1/applications/{id}:
    get:
      operationId: ApplicationService_GetApplication
      parameters:
      - in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetApplicationResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
      - ApplicationService
  /v1/applications/{id}/status:
    patch:
      operationId: ApplicationService_UpdateApplicationStatus
      parameters:
      - in: path
        name: id
        required: true
        type: string
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/ApplicationServiceUpdateApplicationStatusBody'
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Application'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
      - ApplicationService
  /v1/auth/login:
    post:
      description: 'Rate limited to 10 requests per minute per IP. Sets the HttpOnly
        `sh_rt` refresh cookie (Path=/v1/auth) and the `sh_session=1` marker cookie.
        Login CSRF defence: the `Content-Type` media type must be `application/json`
        (400 INVALID_ARGUMENT otherwise), and if an `Origin` header is sent it must
        be on the allow-list (403 PERMISSION_DENIED otherwise). A request without
        `Origin` (e.g. curl) is accepted.'
      operationId: Gateway_Login
      parameters:
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/LoginRequest'
      responses:
        "200":
          description: Authenticated.
          headers:
            Set-Cookie:
              description: Sets `sh_rt` (HttpOnly; SameSite=Strict; Path=/v1/auth;
                Max-Age=604800) and `sh_session=1` (HttpOnly; SameSite=Strict; Path=/;
                Max-Age=604800), both Secure per GATEWAY_COOKIE_SECURE (default true).
                Sent as two Set-Cookie headers.
              type: string
          schema:
            $ref: '#/definitions/TokenResponse'
        "400":
          description: Invalid request body, or Content-Type is not application/json.
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "401":
          description: Invalid credentials.
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "403":
          description: Origin not allowed, or account not active.
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "429":
          description: Too many login attempts.
          schema:
            $ref: '#/definitions/ErrorEnvelope'
      summary: Exchange credentials for an access token and set the refresh cookie.
      tags:
      - Auth
  /v1/auth/logout:
    post:
      description: The `Origin` header must be present and on the allow-list (browsers
        set it automatically, scripts cannot). The `sh_rt` cookie is sent automatically
        by browsers with credentials. Always clears the cookies.
      operationId: Gateway_Logout
      responses:
        "204":
          description: Logged out; cookies cleared.
          headers:
            Set-Cookie:
              description: Expires `sh_rt` and `sh_session` (HttpOnly, SameSite=Strict,
                and Secure per GATEWAY_COOKIE_SECURE, default true).
              type: string
        "403":
          description: Origin missing or not allowed.
          schema:
            $ref: '#/definitions/ErrorEnvelope'
      summary: Revoke the refresh token and clear both cookies.
      tags:
      - Auth
  /v1/auth/refresh:
    post:
      description: The request must carry the cookie `sh_rt` (sent automatically by
        browsers when requests are made with credentials). The `Origin` header must
        be present and on the allow-list (CSRF defence); browsers set it automatically,
        scripts cannot. The request has no body and no declared parameters, because
        Swagger 2.0 cannot describe cookies.
      operationId: Gateway_Refresh
      responses:
        "200":
          description: Tokens rotated.
          headers:
            Set-Cookie:
              description: Replaces `sh_rt` and `sh_session`; both are HttpOnly and
                SameSite=Strict, and Secure per GATEWAY_COOKIE_SECURE (default true).
              type: string
          schema:
            $ref: '#/definitions/TokenResponse'
        "401":
          description: The `sh_rt` cookie is missing (cookies are not cleared), or
            the auth service rejected the token as invalid, expired or reused (both
            cookies are then cleared).
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "403":
          description: Origin missing or not allowed.
          schema:
            $ref: '#/definitions/ErrorEnvelope'
      summary: Rotate the refresh cookie and return a new access token.
      tags:
      - Auth
  /v1/auth/register:
    post:
      operationId: AuthService_Register
      parameters:
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1RegisterRequest'
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1RegisterResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
      - AuthService
  /v1/cvs:
    get:
      operationId: CandidateService_ListMyCVs
      parameters:
      - description: 0 = default 20
        format: int32
        in: query
        name: page_size
        required: false
        type: integer
      - in: query
        name: page_token
        required: false
        type: string
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListMyCVsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
      - CandidateService
  /v1/cvs/{id}:
    get:
      operationId: CandidateService_GetCV
      parameters:
      - in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1CV'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
      - CandidateService
  /v1/cvs/{id}/parsed:
    patch:
      operationId: CandidateService_UpdateParsedData
      parameters:
      - in: path
        name: id
        required: true
        type: string
      - in: body
        name: parsed
        required: true
        schema:
          $ref: '#/definitions/v1ParsedCV'
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1CV'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
      - CandidateService
  /v1/cvs/{id}/recommended-jobs:
    get:
      operationId: CandidateService_ListRecommendedJobs
      parameters:
      - in: path
        name: id
        required: true
        type: string
      - description: 0 = default 20
        format: int32
        in: query
        name: top_k
        required: false
        type: integer
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListRecommendedJobsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      summary: Open jobs ranked for one of the caller's parsed CVs by the AI service.
      tags:
      - CandidateService
  /v1/cvs/{id}:complete:
    post:
      operationId: CandidateService_CompleteUpload
      parameters:
