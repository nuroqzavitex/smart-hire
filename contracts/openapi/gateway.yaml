consumes:
- application/json
definitions:
  ErrorEnvelope:
    properties:
      error:
        properties:
          code:
            description: gRPC code name, e.g. UNAUTHENTICATED.
            type: string
          details:
            items:
              type: object
            type: array
          message:
            type: string
          request_id:
            type: string
        required:
        - code
        - message
        type: object
    required:
    - error
    type: object
  JobServiceCloseJobBody:
    type: object
  JobServicePublishJobBody:
    type: object
  JobServiceUpdateJobBody:
    properties:
      description:
        type: string
      level:
        $ref: '#/definitions/v1JobLevel'
      location:
        type: string
      niceToHaveSkills:
        $ref: '#/definitions/v1StringList'
      requiredSkills:
        $ref: '#/definitions/v1StringList'
      salaryMax:
        format: int32
        type: integer
      salaryMin:
        format: int32
        type: integer
      title:
        type: string
    type: object
  LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  TokenResponse:
    properties:
      access_token:
        description: RS256 JWT access token.
        type: string
      expires_in:
        description: Access token lifetime in seconds.
        format: int64
        type: integer
    required:
    - access_token
    - expires_in
    type: object
  protobufAny:
    additionalProperties: true
    properties:
      '@type':
        type: string
    type: object
  rpcStatus:
    properties:
      code:
        format: int32
        type: integer
      details:
        items:
          $ref: '#/definitions/protobufAny'
          type: object
        type: array
      message:
        type: string
    type: object
  v1CreateJobRequest:
    properties:
      description:
        type: string
      level:
        $ref: '#/definitions/v1JobLevel'
      location:
        type: string
      niceToHaveSkills:
        items:
          type: string
        type: array
      requiredSkills:
        items:
          type: string
        type: array
      salaryMax:
        format: int32
        type: integer
      salaryMin:
        format: int32
        type: integer
      title:
        type: string
    type: object
  v1Job:
    properties:
      createdAt:
        format: date-time
        type: string
      description:
        type: string
      id:
        type: string
      level:
        $ref: '#/definitions/v1JobLevel'
      location:
        type: string
      niceToHaveSkills:
        items:
          type: string
        type: array
      publishedAt:
        format: date-time
        type: string
      recruiterId:
        type: string
      requiredSkills:
        items:
          type: string
        type: array
      salaryMax:
        format: int32
        type: integer
      salaryMin:
        format: int32
        type: integer
      status:
        $ref: '#/definitions/v1JobStatus'
      title:
        type: string
      updatedAt:
        format: date-time
        type: string
      version:
        format: int64
        type: string
    type: object
  v1JobLevel:
    default: JOB_LEVEL_UNSPECIFIED
    enum:
    - JOB_LEVEL_UNSPECIFIED
    - JOB_LEVEL_INTERN
    - JOB_LEVEL_JUNIOR
    - JOB_LEVEL_MIDDLE
    - JOB_LEVEL_SENIOR
    - JOB_LEVEL_LEAD
    type: string
  v1JobStatus:
    default: JOB_STATUS_UNSPECIFIED
    enum:
    - JOB_STATUS_UNSPECIFIED
    - JOB_STATUS_DRAFT
    - JOB_STATUS_OPEN
    - JOB_STATUS_CLOSED
    type: string
  v1ListJobsResponse:
    properties:
      jobs:
        items:
          $ref: '#/definitions/v1Job'
          type: object
        type: array
      nextPageToken:
        type: string
    type: object
  v1RegisterRequest:
    properties:
      email:
        type: string
      password:
        type: string
      role:
        $ref: '#/definitions/v1Role'
    type: object
  v1RegisterResponse:
    properties:
      userId:
        type: string
    type: object
  v1Role:
    default: ROLE_UNSPECIFIED
    enum:
    - ROLE_UNSPECIFIED
    - ROLE_CANDIDATE
    - ROLE_RECRUITER
    - ROLE_ADMIN
    type: string
  v1StringList:
    properties:
      values:
        items:
          type: string
        type: array
    type: object
  v1User:
    properties:
      createdAt:
        format: date-time
        type: string
      email:
        type: string
      id:
        type: string
      role:
        $ref: '#/definitions/v1Role'
    type: object
info:
  title: SmartHire Gateway API
  version: version not set
paths:
  /v1/auth/login:
    post:
      description: 'Rate limited to 10 requests per minute per IP. Sets the HttpOnly
        `sh_rt` refresh cookie (Path=/v1/auth) and the `sh_session=1` marker cookie.
        Login CSRF defence: the `Content-Type` media type must be `application/json`
        (400 INVALID_ARGUMENT otherwise), and if an `Origin` header is sent it must
        be on the allow-list (403 PERMISSION_DENIED otherwise). A request without
        `Origin` (e.g. curl) is accepted.'
      operationId: Gateway_Login
      parameters:
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/LoginRequest'
      responses:
        "200":
          description: Authenticated.
          headers:
            Set-Cookie:
              description: Sets `sh_rt` (HttpOnly; SameSite=Strict; Path=/v1/auth;
                Max-Age=604800) and `sh_session=1` (HttpOnly; SameSite=Strict; Path=/;
                Max-Age=604800), both Secure per GATEWAY_COOKIE_SECURE (default true).
                Sent as two Set-Cookie headers.
              type: string
          schema:
            $ref: '#/definitions/TokenResponse'
        "400":
          description: Invalid request body, or Content-Type is not application/json.
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "401":
          description: Invalid credentials.
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "403":
          description: Origin not allowed, or account not active.
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "429":
          description: Too many login attempts.
          schema:
            $ref: '#/definitions/ErrorEnvelope'
      summary: Exchange credentials for an access token and set the refresh cookie.
      tags:
      - Auth
  /v1/auth/logout:
    post:
      description: The `Origin` header must be present and on the allow-list (browsers
        set it automatically, scripts cannot). The `sh_rt` cookie is sent automatically
        by browsers with credentials. Always clears the cookies.
      operationId: Gateway_Logout
      responses:
        "204":
          description: Logged out; cookies cleared.
          headers:
            Set-Cookie:
              description: Expires `sh_rt` and `sh_session` (HttpOnly, SameSite=Strict,
                and Secure per GATEWAY_COOKIE_SECURE, default true).
              type: string
        "403":
          description: Origin missing or not allowed.
          schema:
            $ref: '#/definitions/ErrorEnvelope'
      summary: Revoke the refresh token and clear both cookies.
      tags:
      - Auth
  /v1/auth/refresh:
    post:
      description: The request must carry the cookie `sh_rt` (sent automatically by
        browsers when requests are made with credentials). The `Origin` header must
        be present and on the allow-list (CSRF defence); browsers set it automatically,
        scripts cannot. The request has no body and no declared parameters, because
        Swagger 2.0 cannot describe cookies.
      operationId: Gateway_Refresh
      responses:
        "200":
          description: Tokens rotated.
          headers:
            Set-Cookie:
              description: Replaces `sh_rt` and `sh_session`; both are HttpOnly and
                SameSite=Strict, and Secure per GATEWAY_COOKIE_SECURE (default true).
              type: string
          schema:
            $ref: '#/definitions/TokenResponse'
        "401":
          description: The `sh_rt` cookie is missing (cookies are not cleared), or
            the auth service rejected the token as invalid, expired or reused (both
            cookies are then cleared).
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "403":
          description: Origin missing or not allowed.
          schema:
            $ref: '#/definitions/ErrorEnvelope'
      summary: Rotate the refresh cookie and return a new access token.
      tags:
      - Auth
  /v1/auth/register:
    post:
      operationId: AuthService_Register
      parameters:
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1RegisterRequest'
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1RegisterResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
      - AuthService
  /v1/jobs:
    get:
      operationId: JobService_ListJobs
      parameters:
      - in: query
        name: q
        required: false
        type: string
      - collectionFormat: multi
        in: query
        items:
          type: string
        name: skills
        required: false
        type: array
      - in: query
        name: location
        required: false
        type: string
      - default: JOB_LEVEL_UNSPECIFIED
        description: 0 = no filter
        enum:
        - JOB_LEVEL_UNSPECIFIED
        - JOB_LEVEL_INTERN
        - JOB_LEVEL_JUNIOR
        - JOB_LEVEL_MIDDLE
        - JOB_LEVEL_SENIOR
        - JOB_LEVEL_LEAD
        in: query
        name: level
        required: false
        type: string
      - format: int32
        in: query
        name: salaryMin
        required: false
        type: integer
      - description: 0 = default 20
        format: int32
        in: query
        name: pageSize
        required: false
        type: integer
      - in: query
        name: pageToken
        required: false
        type: string
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListJobsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
      - JobService
    post:
      operationId: JobService_CreateJob
      parameters:
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1CreateJobRequest'
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Job'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
      - JobService
  /v1/jobs/{id}:
    delete:
      operationId: JobService_DeleteJob
      parameters:
      - in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: A successful response.
          schema:
            properties: {}
            type: object
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
      - JobService
    get:
      operationId: JobService_GetJob
      parameters:
      - in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Job'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
      - JobService
    patch:
      operationId: JobService_UpdateJob
      parameters:
      - in: path
        name: id
        required: true
        type: string
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/JobServiceUpdateJobBody'
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Job'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
      - JobService
  /v1/jobs/{id}:close:
    post:
      operationId: JobService_CloseJob
      parameters:
      - in: path
        name: id
        required: true
        type: string
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/JobServiceCloseJobBody'
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Job'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
      - JobService
  /v1/jobs/{id}:publish:
    post:
      operationId: JobService_PublishJob
      parameters:
      - in: path
        name: id
        required: true
        type: string
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/JobServicePublishJobBody'
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Job'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
      - JobService
  /v1/me:
    get:
      operationId: AuthService_GetMe
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1User'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
      - AuthService
  /v1/me/jobs:
    get:
      operationId: JobService_ListMyJobs
      parameters:
      - default: JOB_STATUS_UNSPECIFIED
        description: 0 = any status
        enum:
        - JOB_STATUS_UNSPECIFIED
        - JOB_STATUS_DRAFT
        - JOB_STATUS_OPEN
        - JOB_STATUS_CLOSED
        in: query
        name: status
        required: false
        type: string
      - format: int32
        in: query
        name: pageSize
        required: false
        type: integer
      - in: query
        name: pageToken
        required: false
        type: string
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListJobsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
      - JobService
produces:
- application/json
swagger: "2.0"
tags:
- name: AuthService
- name: JobService
