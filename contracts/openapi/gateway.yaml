swagger: "2.0"
tags:
- description: |-
    AIService is internal to the compose network (no JWT, ADR 0010): Job and
    Candidate check ownership before calling it.
  name: AIService
- description: |-
    ApplicationService: candidates apply to open jobs; an orchestration saga
    reserves quota and scores the application in the background (ADR 0011).
  name: ApplicationService
- name: AuthService
- name: CandidateService
- name: JobService
- description: |-
    NotificationService lists the caller's notifications (ADR 0012). New ones
    are also pushed over the gateway WebSocket (/v1/ws).
  name: NotificationService
