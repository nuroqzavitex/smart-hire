version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/nuroqzavitex/smarthire/gen/go
  disable:
    - module: buf.build/googleapis/googleapis
    - module: buf.build/bufbuild/protovalidate
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: ../../gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.6.2
    out: ../../gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc-ecosystem/gateway:v2.33.0
    out: ../../gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc-ecosystem/openapiv2:v2.33.0
    out: ../openapi/gen
    opt: allow_merge=true,merge_file_name=gateway
