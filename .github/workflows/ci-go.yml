name: ci-go

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      modules: ${{ steps.matrix.outputs.modules }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared:
              - 'pkg/**'
              - 'gen/**'
              - 'contracts/events/**'
              - 'go.work'
              - 'go.work.sum'
              - '.github/workflows/ci-go.yml'
            auth:
              - 'services/auth/**'
            gateway:
              - 'services/gateway/**'
            job:
              - 'services/job/**'
              - 'deploy/docker/opensearch/**'
            candidate:
              - 'services/candidate/**'
              - 'deploy/docker/minio/**'
            application:
              - 'services/application/**'
            tools:
              - 'tools/**'
      # Changes in pkg/, gen/ (or the workspace) run every module.
      - name: Build module matrix
        id: matrix
        env:
          SHARED: ${{ steps.filter.outputs.shared }}
          AUTH: ${{ steps.filter.outputs.auth }}
          GATEWAY: ${{ steps.filter.outputs.gateway }}
          JOB: ${{ steps.filter.outputs.job }}
          CANDIDATE: ${{ steps.filter.outputs.candidate }}
          APPLICATION: ${{ steps.filter.outputs.application }}
          TOOLS: ${{ steps.filter.outputs.tools }}
        run: |
          mods=()
          if [ "$SHARED" = "true" ]; then mods+=(pkg gen/go); fi
          if [ "$SHARED" = "true" ] || [ "$AUTH" = "true" ]; then mods+=(services/auth); fi
          if [ "$SHARED" = "true" ] || [ "$GATEWAY" = "true" ]; then mods+=(services/gateway); fi
          if [ "$SHARED" = "true" ] || [ "$JOB" = "true" ]; then mods+=(services/job); fi
          if [ "$SHARED" = "true" ] || [ "$CANDIDATE" = "true" ]; then mods+=(services/candidate); fi
          if [ "$SHARED" = "true" ] || [ "$APPLICATION" = "true" ]; then mods+=(services/application); fi
          if [ "$SHARED" = "true" ] || [ "$TOOLS" = "true" ]; then mods+=(tools); fi
          if [ ${#mods[@]} -eq 0 ]; then
            json='[]'
          else
            json=$(printf '%s\n' "${mods[@]}" | jq -R . | jq -sc .)
          fi
          echo "modules=$json" >> "$GITHUB_OUTPUT"

  module:
    needs: changes
    if: needs.changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}
      - name: Unit tests
        working-directory: ${{ matrix.module }}
        run: go test -race ./...
      # Candidate integration tests run the locally built MinIO image (ADR 0008,
      # E-R4); job integration tests run OpenSearch + analysis-icu (ADR 0009).
      - uses: docker/setup-buildx-action@v4
        if: matrix.module == 'services/candidate' || matrix.module == 'services/job'
      - name: Build MinIO test image
        if: matrix.module == 'services/candidate'
        uses: docker/build-push-action@v7
        with:
          context: deploy/docker/minio
          load: true
          push: false
          tags: smarthire/minio:RELEASE.2025-04-22T22-12-26Z
          cache-from: type=gha,scope=minio
          cache-to: type=gha,mode=max,scope=minio
      - name: Build OpenSearch test image
        if: matrix.module == 'services/job'
        uses: docker/build-push-action@v7
        with:
          context: deploy/docker/opensearch
          load: true
          push: false
          tags: smarthire/opensearch:2.19.2-icu
          cache-from: type=gha,scope=opensearch
          cache-to: type=gha,mode=max,scope=opensearch
      - name: Integration tests
        if: startsWith(matrix.module, 'services/') || matrix.module == 'pkg'
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 -tags integration ./...
      - name: Coverage gate
        if: matrix.module == 'services/auth'
        run: make cover-auth
      - name: Coverage gate (job)
        if: matrix.module == 'services/job'
        run: make cover-job
      - name: Coverage gate (candidate)
        if: matrix.module == 'services/candidate'
        run: make cover-candidate
      - name: Coverage gate (application)
        if: matrix.module == 'services/application'
        run: make cover-application

  docker:
    needs: changes
    if: needs.changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, gateway, job, candidate, application]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
