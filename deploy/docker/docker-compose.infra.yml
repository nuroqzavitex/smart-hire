# Infrastructure: Postgres, Redis, Redpanda and MinIO.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Read by init/postgres/01-create-dbs.sql to create the auth_svc role.
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
      # Read by init/postgres/02-create-job-db.sql to create the job_svc role.
      JOB_DB_PASSWORD: ${JOB_DB_PASSWORD:?set JOB_DB_PASSWORD in .env}
      # Read by init/postgres/03-create-candidate-db.sql (candidate_svc role).
      CANDIDATE_DB_PASSWORD: ${CANDIDATE_DB_PASSWORD:?set CANDIDATE_DB_PASSWORD in .env}
      # Read by init/postgres/04-create-ai-db.sql (ai_svc role).
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?set AI_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP, not the unix socket: the image's temporary init server listens
      # only on the socket, so this passes only once init has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d auth_db"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
    ports:
      - "127.0.0.1:19092:19092"   # D9: dev/smoke only
    volumes: [redpanda-data:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  topics-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    entrypoint: ["/bin/bash", "/init/create-topics.sh"]
    volumes: [./init/redpanda:/init:ro]
    depends_on: { redpanda: { condition: service_healthy } }
    restart: "no"

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.8.0
    environment: { KAFKA_BROKERS: "redpanda:9092" }
    ports: ["127.0.0.1:8081:8080"]
    depends_on: { redpanda: { condition: service_healthy } }
    restart: unless-stopped

  # Built locally from the official GitHub source (ruling E-R2, ADR 0008):
  # minio RELEASE.2025-04-22T22-12-26Z + mc RELEASE.2025-04-16T18-13-26Z.
  minio:
    image: &minio-image smarthire/minio:RELEASE.2025-04-22T22-12-26Z
    build: &minio-build { context: ./minio }
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # One-shot, idempotent: private bucket cvs + least-privilege service users.
  minio-init:
    image: *minio-image
    build: *minio-build
    entrypoint: ["/bin/sh", "/init/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      CANDIDATE_S3_ACCESS_KEY: ${CANDIDATE_S3_ACCESS_KEY:?set CANDIDATE_S3_ACCESS_KEY in .env}
      CANDIDATE_S3_SECRET_KEY: ${CANDIDATE_S3_SECRET_KEY:?set CANDIDATE_S3_SECRET_KEY in .env}
      AI_S3_ACCESS_KEY: ${AI_S3_ACCESS_KEY:?set AI_S3_ACCESS_KEY in .env}
      AI_S3_SECRET_KEY: ${AI_S3_SECRET_KEY:?set AI_S3_SECRET_KEY in .env}
    volumes: [./init/minio:/init:ro]
    depends_on: { minio: { condition: service_healthy } }
    restart: "no"

  # Job read model (ADR 0009): official image + analysis-icu, single node,
  # security plugin off (dev only, compose network + 127.0.0.1).
  opensearch:
    image: smarthire/opensearch:2.19.2-icu
    build: { context: ./opensearch }
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["127.0.0.1:9200:9200"]
    volumes: [opensearch-data:/usr/share/opensearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 30
    restart: unless-stopped

volumes:
  postgres-data:
  redpanda-data:
  minio-data:
  opensearch-data:

networks:
  default:
    name: smarthire
